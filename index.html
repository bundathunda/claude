<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f2;
      --surface: #ffffff;
      --border: #e3e1dc;
      --text: #181715;
      --muted: #68655f;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
      --accent-dim: #c4b5fd;
      --accent-dark: #4c1d95;
      --hero-bg: #09090b;
      --hero-text: #f4f3f1;
      --hero-sub: #8b8884;
      --tag-bg: #eeece8;
      --tag-text: #3f3d39;
      --sidebar-bg: #0f0f11;
      --sidebar-text: #9d9b97;
      --sidebar-active: #c4b5fd;
      --sidebar-border: #1e1e22;
      --tbd: #a1a1aa;

      --day1: #c084fc;  /* pre-party — violet */
      --day2: #818cf8;  /* ABGT700 — indigo */
      --day3: #34d399;  /* anjunadeep — emerald */
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* ── Sidebar (desktop) ── */
    .sidebar {
      display: none;
    }

    @media (min-width: 900px) {
      body { display: flex; min-height: 100vh; }

      .sidebar {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; left: 0;
        width: 192px;
        height: 100vh;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--sidebar-border);
        overflow-y: auto;
        z-index: 100;
        padding: 1.5rem 0 2rem;
      }

      .sidebar-brand {
        padding: 0 1.25rem 1.25rem;
        border-bottom: 1px solid var(--sidebar-border);
        margin-bottom: 1rem;
      }
      .sidebar-brand-name {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent-dim);
        line-height: 1.3;
      }
      .sidebar-brand-dates {
        font-size: 0.65rem;
        color: var(--sidebar-text);
        margin-top: 0.2rem;
      }

      .sidebar-nav { flex: 1; }
      .sidebar-link {
        display: block;
        padding: 0.45rem 1.25rem;
        font-size: 0.775rem;
        color: var(--sidebar-text);
        text-decoration: none;
        border-left: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
      }
      .sidebar-link:hover { color: #e5e3e0; }
      .sidebar-link.active {
        color: var(--sidebar-active);
        border-left-color: var(--sidebar-active);
        background: rgba(124,58,237,0.08);
      }

      .page-wrap {
        margin-left: 192px;
        flex: 1;
        min-width: 0;
      }
    }

    /* ── Mobile top nav ── */
    .mobile-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--sidebar-border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-nav::-webkit-scrollbar { display: none; }
    .mobile-nav-inner {
      display: inline-flex;
      gap: 0;
      padding: 0 0.5rem;
    }
    .mobile-nav-link {
      display: inline-block;
      padding: 0.6rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--sidebar-text);
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .mobile-nav-link.active {
      color: var(--sidebar-active);
      border-bottom-color: var(--sidebar-active);
    }

    @media (min-width: 900px) {
      .mobile-nav { display: none; }
    }

    /* ── Hero ── */
    .hero {
      background: var(--hero-bg);
      color: var(--hero-text);
      padding: 3.5rem 1.25rem 3rem;
      text-align: center;
    }
    .hero-eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-dim);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .hero h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .hero-dates {
      font-size: 1rem;
      color: var(--hero-sub);
      margin-bottom: 0.35rem;
    }
    .hero-airbnb {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.5rem;
      font-size: 0.775rem;
      color: var(--accent-dim);
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.15s;
    }
    .hero-airbnb:hover { opacity: 1; }
    .hero-pill {
      display: inline-block;
      margin-top: 1.4rem;
      background: rgba(124,58,237,0.2);
      color: #c4b5fd;
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 99px;
      padding: 0.3rem 1rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ── Layout ── */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1rem 5rem;
    }

    section {
      margin-top: 2.75rem;
      scroll-margin-top: 3rem;
    }

    .section-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.875rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .card + .card { margin-top: 0.75rem; }

    .card-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .card-row:last-child { border-bottom: none; }

    .card-icon {
      font-size: 1rem;
      flex-shrink: 0;
      width: 1.5rem;
      text-align: center;
      margin-top: 0.1rem;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem;
    }
    .card-sub {
      font-size: 0.775rem;
      color: var(--muted);
    }
    .card-aside {
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
      text-align: right;
      white-space: nowrap;
    }

    /* ── Guest chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .chip {
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 99px;
      padding: 0.25rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 500;
    }

    /* ── Rooms ── */
    .room-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 420px) {
      .room-grid { grid-template-columns: 1fr; }
    }
    .room-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
    }
    .room-name {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .room-bed {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .room-capacity {
      font-size: 0.73rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }
    .room-occupants {
      font-size: 0.775rem;
      color: var(--muted);
    }
    .room-occupants .name-list {
      color: var(--text);
      font-weight: 500;
    }
    .tbd { color: var(--tbd); font-style: italic; }

    /* ── Lineup ── */
    .lineup-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .lineup-header {
      padding: 0.75rem 1rem 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .lineup-header-left {}
    .lineup-event-name {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text);
    }
    .lineup-day-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .lineup-start {
      font-size: 0.7rem;
      font-weight: 600;
      font-family: ui-monospace, "SF Mono", monospace;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      white-space: nowrap;
    }
    .lineup-act {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .lineup-act:last-child { border-bottom: none; }
    .lineup-act-name {
      font-size: 0.84rem;
      color: var(--text);
      font-weight: 400;
    }
    .lineup-act.headliner .lineup-act-name {
      font-weight: 700;
      font-size: 0.92rem;
    }
    .lineup-act-note {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      background: var(--tag-bg);
      color: var(--muted);
    }
    .lineup-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Flights ── */
    .flight-badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: ui-monospace, "SF Mono", monospace;
    }
    .flight-badge.tbd-badge {
      color: var(--tbd);
      background: #f4f4f5;
    }
    .flag {
      display: inline-block;
      margin-left: 0.4rem;
      font-size: 0.66rem;
      background: #fef9ec;
      color: #92400e;
      border: 1px solid #f59e0b;
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
      font-weight: 700;
      vertical-align: middle;
    }

    /* ── Schedule ── */
    .schedule-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .schedule-day-header {
      background: var(--tag-bg);
      padding: 0.5rem 1rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .schedule-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    .schedule-item:last-child { border-bottom: none; }
    .schedule-time {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      min-width: 3.5rem;
      padding-top: 0.1rem;
      font-family: ui-monospace, "SF Mono", monospace;
    }
    .schedule-desc { font-size: 0.84rem; color: var(--text); }
    .schedule-note { font-size: 0.73rem; color: var(--muted); margin-top: 0.12rem; }

    /* ── Money ── */
    .money-highlight {
      background: var(--accent-light);
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .money-highlight .amount {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--accent-dark);
      letter-spacing: -0.02em;
    }
    .money-highlight .per-person {
      font-size: 0.8rem;
      color: var(--accent-dark);
      margin-top: 0.1rem;
    }
    .money-highlight .money-meta {
      font-size: 0.73rem;
      color: #6d28d9;
      margin-top: 0.25rem;
    }

    /* ── Good to Know / Bring ── */
    .know-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .know-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
      font-size: 0.84rem;
    }
    .know-item:last-child { border-bottom: none; }
    .know-icon { flex-shrink: 0; font-size: 1rem; }

    .bring-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    @media (max-width: 380px) {
      .bring-grid { grid-template-columns: 1fr; }
    }
    .bring-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.82rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .bring-icon { font-size: 0.95rem; }

    /* ── Carpool ── */
    .carpool-tbd {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
    }
    .carpool-tbd strong { display: block; color: var(--text); font-size: 0.875rem; margin-bottom: 0.25rem; }

    /* ── Airbnb callout ── */
    .airbnb-callout {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-top: 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s;
    }
    .airbnb-callout:hover { border-color: var(--accent-dim); }
    .airbnb-callout-text { font-size: 0.82rem; color: var(--muted); }
    .airbnb-callout-label { font-size: 0.84rem; font-weight: 600; color: var(--text); margin-bottom: 0.1rem; }

    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      font-size: 0.73rem;
      color: var(--muted);
    }
  </style>
</head>

  { id: "flights",  label: "Flights" },
  { id: "carpools", label: "Carpools" },
  { id: "money",    label: "Money" },
  { id: "schedule", label: "Schedule" },
  { id: "know",     label: "Good to Know" },
  { id: "bring",    label: "What to Bring" },
];

function buildNav() {
  // Sidebar (desktop)
  const sidebar = document.getElementById("sidebar");
  const brand = document.createElement("div");
  brand.className = "sidebar-brand";
  brand.innerHTML = `
    <div class="sidebar-brand-name">ABGT700</div>
    <div class="sidebar-brand-dates">Sept 12–15, 2025</div>
  `;
  sidebar.appendChild(brand);

  const nav = document.createElement("nav");
  nav.className = "sidebar-nav";
  NAV.forEach(item => {
    const a = document.createElement("a");
    a.className = "sidebar-link";
    a.href = `#${item.id}`;
    a.textContent = item.label;
    a.dataset.section = item.id;
    nav.appendChild(a);
  });
  sidebar.appendChild(nav);

  // Mobile nav
  const mobileInner = document.getElementById("mobile-nav-inner");
  NAV.forEach(item => {
    const a = document.createElement("a");
    a.className = "mobile-nav-link";
    a.href = `#${item.id}`;
    a.textContent = item.label;
    a.dataset.section = item.id;
    mobileInner.appendChild(a);
  });
}

function initScrollSpy() {
  const sections = NAV.map(n => document.getElementById(n.id)).filter(Boolean);
  const allLinks = document.querySelectorAll("[data-section]");

  const setActive = (id) => {
    allLinks.forEach(l => l.classList.toggle("active", l.dataset.section === id));
    // scroll mobile active link into view
    const activeLink = document.querySelector(`.mobile-nav-link[data-section="${id}"]`);
    if (activeLink) activeLink.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  };

  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) setActive(entry.target.id);
    });
  }, { rootMargin: "-30% 0px -60% 0px", threshold: 0 });

  sections.forEach(s => obs.observe(s));
}

function render() {
  // Hero
  document.getElementById("hero-name").textContent  = TRIP.name;
  document.getElementById("hero-dates").textContent = `${TRIP.checkin} → ${TRIP.checkout}`;
  document.getElementById("hero-pill").textContent  = `${TRIP.nights} nights · ${TRIP.guests.length} guests`;
  const airbnbLink = document.getElementById("hero-airbnb");
  airbnbLink.href = TRIP.airbnb;

  // Guests
  const guestWrap = document.getElementById("guests-chips");
  TRIP.guests.forEach(g => {
    const el = document.createElement("span");
    el.className = "chip";
    el.textContent = g;
    guestWrap.appendChild(el);
  });

  // Rooms
  const roomGrid = document.getElementById("room-grid");
  TRIP.rooms.forEach(r => {
    const card = document.createElement("div");
    card.className = "room-card";
    const occ = r.occupants.length
      ? `<span class="name-list">${r.occupants.join(", ")}</span>`
      : `<span class="tbd">TBD</span>`;
    card.innerHTML = `
      <div class="room-name">${r.id}</div>
      <div class="room-bed">${r.bed}</div>
      <div class="room-capacity">Max ${r.max}</div>
      <div class="room-occupants">Guests: ${occ}</div>
    `;
    roomGrid.appendChild(card);
  });

  // Airbnb link under rooms
  const airbnbCallout = document.getElementById("airbnb-callout");
  airbnbCallout.href = TRIP.airbnb;

  // Lineup
  const lineupWrap = document.getElementById("lineup-wrap");
  TRIP.lineup.forEach(day => {
    const block = document.createElement("div");
    block.className = "lineup-day";
    const startStyle = `background:${day.color}22;color:${day.color};border:1px solid ${day.color}55;`;
    let html = `
      <div class="lineup-header">
        <div class="lineup-header-left">
          <div class="lineup-event-name">${day.event}</div>
          <div class="lineup-day-label">${day.day}</div>
        </div>
        <div class="lineup-start" style="${startStyle}">Doors ${day.start}</div>
      </div>
    `;
    day.acts.forEach(act => {
      const note = act.note ? `<span class="lineup-act-note">${act.note}</span>` : "";
      html += `
        <div class="lineup-act${act.headliner ? " headliner" : ""}">
          <div class="lineup-dot" style="background:${day.color}"></div>
          <div class="lineup-act-name">${act.name}</div>
          ${note}
        </div>
      `;
    });
    block.innerHTML = html;
    lineupWrap.appendChild(block);
  });

  // Flights — arrivals
  const arrWrap = document.getElementById("arrivals");
  TRIP.flights.arrivals.forEach(f => {
    const row = document.createElement("div");
    row.className = "card-row";
    const badge = f.flight === "TBD"
      ? `<span class="flight-badge tbd-badge">TBD</span>`
      : `<span class="flight-badge">${f.flight}</span>`;
    const flag = f.early ? `<span class="flag">Early</span>` : "";
    row.innerHTML = `
      <div class="card-icon">✈️</div>
      <div class="card-body">
        <div class="card-label">${f.who.join(", ")}${flag}</div>
        <div class="card-sub">${f.date} · ${f.time} · ${f.note}</div>
      </div>
      <div class="card-aside">${badge}</div>
    `;
    arrWrap.appendChild(row);
  });

  // Flights — departures
  const depWrap = document.getElementById("departures");
  TRIP.flights.departures.forEach(f => {
    const row = document.createElement("div");
    row.className = "card-row";
    const badge = f.flight === "TBD"
      ? `<span class="flight-badge tbd-badge">TBD</span>`
      : `<span class="flight-badge">${f.flight}</span>`;
    const flag = f.late ? `<span class="flag">Late</span>` : "";
    row.innerHTML = `
      <div class="card-icon">🛫</div>
      <div class="card-body">
        <div class="card-label">${f.who.join(", ")}${flag}</div>
        <div class="card-sub">${f.date} · ${f.time} · ${f.note}</div>
      </div>
      <div class="card-aside">${badge}</div>
    `;
    depWrap.appendChild(row);
  });

  // Carpools
  const carpoolWrap = document.getElementById("carpools-content");
  if (!TRIP.carpools || TRIP.carpools.length === 0) {
    carpoolWrap.innerHTML = `
      <div class="carpool-tbd">
        <strong>Carpools TBD</strong>
        Details will be added once drivers and routes are confirmed.
      </div>
    `;
  } else {
    const card = document.createElement("div");
    card.className = "card";
    TRIP.carpools.forEach(c => {
      const row = document.createElement("div");
      row.className = "card-row";
      row.innerHTML = `
        <div class="card-icon">🚗</div>
        <div class="card-body">
          <div class="card-label">${c.driver} (driver)</div>
          <div class="card-sub">From ${c.from} · ${c.departure}</div>
          <div class="card-sub" style="margin-top:0.15rem">Passengers: ${c.passengers.join(", ")}</div>
        </div>
      `;
      card.appendChild(row);
    });
    carpoolWrap.appendChild(card);
  }

  // Money
  document.getElementById("money-amount").textContent = TRIP.money.perPerson;
  document.getElementById("money-total").textContent  = `Total: ${TRIP.money.totalRental} ÷ ${TRIP.money.guestCount} guests`;
  document.getElementById("money-payto").textContent  = `Venmo ${TRIP.money.payTo} · ${TRIP.money.payWhen}`;

  const moneyCard = document.getElementById("money-notes");
  TRIP.money.notes.forEach(n => {
    const row = document.createElement("div");
    row.className = "card-row";
    row.innerHTML = `
      <div class="card-icon">${n.icon}</div>
      <div class="card-body">
        <div class="card-label">${n.label}</div>
        <div class="card-sub">${n.detail}</div>
      </div>
    `;
    moneyCard.appendChild(row);
  });

  // Schedule
  const schedWrap = document.getElementById("schedule-wrap");
  TRIP.schedule.forEach(day => {
    const block = document.createElement("div");
    block.className = "schedule-day";
    let html = `<div class="schedule-day-header">${day.day}</div>`;
    day.items.forEach(item => {
      html += `
        <div class="schedule-item">
          <div class="schedule-time">${item.time}</div>
          <div>
            <div class="schedule-desc">${item.desc}</div>
            ${item.note ? `<div class="schedule-note">${item.note}</div>` : ""}
          </div>
        </div>
      `;
    });
    block.innerHTML = html;
    schedWrap.appendChild(block);
  });

  // Good to know
  const knowWrap = document.getElementById("know-list");
  TRIP.goodToKnow.forEach(k => {
    const item = document.createElement("div");
    item.className = "know-item";
    item.innerHTML = `<span class="know-icon">${k.icon}</span><span>${k.text}</span>`;
    knowWrap.appendChild(item);
  });

  // What to bring
  const bringWrap = document.getElementById("bring-grid");
  TRIP.whatToBring.forEach(b => {
    const item = document.createElement("div");
    item.className = "bring-item";
    item.innerHTML = `<span class="bring-icon">${b.icon}</span><span>${b.item}</span>`;
    bringWrap.appendChild(item);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  buildNav();
  render();
  initScrollSpy();
});
</script>
